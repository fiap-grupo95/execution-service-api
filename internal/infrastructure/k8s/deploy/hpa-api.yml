apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: execution-service-api-hpa
  namespace: execution-service-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: execution-service-api-deployment
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50